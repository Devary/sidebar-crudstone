<!-- p-sidebar renders its actual panel content portaled elsewhere in the DOM, not as a child of
     this element — its own styleClass (not a plain data-cy attribute, which would stay on this
     zero-size host tag instead) is what reaches it, see .sb-sidebar-panel in the stylesheet -->
<p-sidebar
  [(visible)]="visible"
  [modal]="false"
  [dismissible]="false"
  [showCloseIcon]="false"
  styleClass="sb-sidebar-panel"
>
  @if (loading()) {
    <div class="sb-sidebar-loading" data-cy="sidebar-loading">
      <i class="pi pi-spin pi-spinner"></i>
      {{ i18n.t('loading') }}
    </div>
  } @else {
    @if (sidebarContext(); as context) {
      <nav class="sb-sidebar-tree">
        @for (node of context.nodes; track node) {
          <ng-container *ngTemplateOutlet="nodeTemplate; context: {$implicit: node, depth: 0}"/>
        }
      </nav>
    }
  }
</p-sidebar>

<ng-template #nodeTemplate let-node let-depth="depth">
  @if (node.type === 'group') {
    <div class="sb-sidebar-group" [style.paddingLeft.rem]="depth * 1">
      <button
        type="button"
        class="sb-sidebar-group-toggle"
        [attr.data-cy]="'sidebar-group-' + node.title"
        (click)="toggleGroup(node)"
      >
        <i class="pi" [class.pi-chevron-down]="isExpanded(node)" [class.pi-chevron-right]="!isExpanded(node)"></i>
        {{ node.title }}
      </button>
      @if (isExpanded(node)) {
        @for (child of node.children; track child) {
          <ng-container *ngTemplateOutlet="nodeTemplate; context: {$implicit: child, depth: depth + 1}"/>
        }
      }
    </div>
  } @else {
    <a
      class="sb-sidebar-link"
      [style.paddingLeft.rem]="depth * 1 + 1"
      [href]="linkHref(node)"
      [attr.data-cy]="'sidebar-link-' + node.title"
    >
      {{ node.title }}
    </a>
  }
</ng-template>
