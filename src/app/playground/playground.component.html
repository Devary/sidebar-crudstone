<div class="pg-sidebar-pin" [class.pg-sidebar-pin-right]="settings().side === 'right'">
  <sb-sidebar
    [context]="mainContext()"
    [activePaths]="['conventions']"
    [showTrigger]="false"
    [settingsMenu]="true"
    (settingsSelected)="openSettings()"
    [(open)]="sidebarOpen"
    style="--sb-height: 100%"
  >
    <div sb-footer class="pg-user">
      <span class="pg-user-avatar">JD</span>
      <span class="pg-user-name sb-collapse-hidden">John Doe</span>
    </div>
  </sb-sidebar>
</div>

<div class="pg-main" [style]="contentStyle()">
  <div class="pg-main-header">
    <button type="button" class="pg-toggle" (click)="toggleSidebar()" data-cy="pg-toggle" aria-label="Toggle sidebar">
      <i class="pi pi-objects-column"></i>
    </button>
  </div>
  <div class="pg-block pg-block-fill"></div>
</div>

<p-dialog
  header="Settings"
  [(visible)]="settingsOpen"
  [modal]="true"
  [closable]="false"
  [draggable]="false"
  styleClass="pg-settings-dialog"
  data-cy="pg-settings-dialog"
>
  <div class="pg-settings-form">
    <div class="pg-field">
      <label>Theme</label>
      <p-select [options]="themeOptions" optionLabel="label" optionValue="value" [(ngModel)]="staged.theme" appendTo="body" data-cy="pg-theme">
        <ng-template pTemplate="selectedItem" let-option>
          <span class="pg-theme-option">
            @if (option.color) {
              <span class="pg-theme-dot" [style.background]="option.color"></span>
            }
            {{ option.label }}
          </span>
        </ng-template>
        <ng-template pTemplate="item" let-option>
          <span class="pg-theme-option">
            @if (option.color) {
              <span class="pg-theme-dot" [style.background]="option.color"></span>
            }
            {{ option.label }}
          </span>
        </ng-template>
      </p-select>
    </div>
    <div class="pg-field pg-field-switch">
      <label>Dark Mode</label>
      <p-toggleswitch [(ngModel)]="staged.darkMode" data-cy="pg-dark-mode"/>
    </div>
    <div class="pg-field">
      <label>Variant</label>
      <p-select [options]="variantOptions" optionLabel="label" optionValue="value" [(ngModel)]="staged.variant" appendTo="body" data-cy="pg-variant"/>
    </div>
    <div class="pg-field">
      <label>Collapsible</label>
      <p-select [options]="collapsibleOptions" optionLabel="label" optionValue="value" [(ngModel)]="staged.collapsible" appendTo="body" data-cy="pg-collapsible"/>
    </div>
    <div class="pg-field">
      <label>Side</label>
      <p-select [options]="sideOptions" optionLabel="label" optionValue="value" [(ngModel)]="staged.side" appendTo="body" data-cy="pg-side"/>
    </div>
    <div class="pg-field pg-field-switch">
      <label>Overlay</label>
      <p-toggleswitch [(ngModel)]="staged.overlay" data-cy="pg-overlay"/>
    </div>
    <div class="pg-field pg-field-switch">
      <label>Open on Hover</label>
      <p-toggleswitch [(ngModel)]="staged.openOnHover" data-cy="pg-open-on-hover"/>
    </div>
    <div class="pg-field pg-field-switch">
      <label>Backdrop</label>
      <p-toggleswitch [(ngModel)]="staged.backdrop" data-cy="pg-backdrop"/>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <p-button label="Cancel" [text]="true" severity="secondary" (onClick)="cancelSettings()" data-cy="pg-settings-cancel"/>
    <p-button label="Save" (onClick)="saveSettings()" data-cy="pg-settings-save"/>
  </ng-template>
</p-dialog>

<p-confirmdialog/>
